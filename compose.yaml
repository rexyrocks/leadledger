services:
  falkordb:
    image: ${FALKORDB_IMAGE:-falkordb/falkordb:latest}
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - leadledger_data:/data
    environment:
      REDIS_ARGS: "--dir /data --appendonly yes --appendfsync everysec --maxmemory-policy noeviction"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  leadledger_data:
