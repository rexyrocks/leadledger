[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leadledger"
version = "0.1.0"
description = "Graph-backed lead workflow with auditable, approved sandbox outreach"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "falkordb>=1.8,<2", "pydantic>=2.10,<3", "jsonschema>=4.23,<5", "email-validator>=2.2,<3", "dnspython>=2.6,<3"]

[project.optional-dependencies]
local = ["falkordblite==0.10.0; sys_platform == 'darwin' or sys_platform == 'linux'"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["leadledger*"]

[tool.setuptools.package-data]
leadledger = ["queries/*.cypher", "web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
